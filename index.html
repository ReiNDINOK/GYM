<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Калькулятор рабочих весов</title>
<style>
:root {
  --bg-main: linear-gradient(135deg,#333 0%,#1c1c1c 100%);
  --bg-sidebar: #1b1b1b;
  --bg-container: #212121;
  --bg-section: #282828;
  --bg-card: #333;
  --bg-input: #2a2a2a;
  --bg-table: #3a3a3a;
  --bg-table-header: #555;

  --text-main: #ddd;
  --text-secondary: #aaa;
  --text-title: #f0f0f0;
  --text-contrast: #fff;

  --border-color: #4a4a4a;
  --header-bg: linear-gradient(135deg,#444 0%,#333 100%);
  --accent: #7f8c8d;
  --btn-bg: linear-gradient(135deg,#7f8c8d 0%,#5f6a6a 100%);
  --btn-text: #fff;
  --error-bg: #a60000;
  --error-text: #fff;
  --shadow: 0 8px 24px rgba(0,0,0,.45);
  --radius: 16px;
}
body.light-theme {
  --bg-main: linear-gradient(135deg,#f2f2f2 0%,#e8e8e8 100%);
  --bg-sidebar: #eaeaea;
  --bg-container: #fff;
  --bg-section: #f9f9f9;
  --bg-card: #f1f1f1;
  --bg-input: #fff;
  --bg-table: #f5f5f5;
  --bg-table-header: #ddd;
  --text-main: #222;
  --text-secondary: #555;
  --text-title: #111;
  --text-contrast: #000;
  --border-color: #ccc;
  --header-bg: linear-gradient(135deg,#ddd 0%,#bbb 100%);
  --btn-bg: linear-gradient(135deg,#bbb 0%,#999 100%);
  --btn-text: #222;
  --shadow: 0 8px 24px rgba(0,0,0,.12);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  background: var(--bg-main);
  background-attachment: fixed;
  min-height:100vh; padding:20px;
  display:flex; gap:20px; align-items:flex-start;
  color: var(--text-main);
  transition: color .3s;
}

/* ---------- Меню ---------- */
.sidebar {
  width:230px; flex-shrink:0;
  background: var(--bg-sidebar);
  border:1px solid var(--border-color);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding:16px;
  position:sticky; top:20px;
}
.sidebar h2 {
  font-size:.85em; letter-spacing:.14em; text-transform:uppercase;
  margin-bottom:12px; color: var(--text-secondary); text-align:center;
}
.sidebar ul { list-style:none; }
.sidebar li { margin:4px 0; }
.sidebar a {
  display:block; padding:10px 12px; text-decoration:none;
  color: var(--text-main); border-radius:10px;
  transition: background .2s, color .2s, transform .2s;
}
.sidebar a:hover { background: var(--bg-card); color: var(--text-contrast); transform: translateX(2px); }
.dropdown > a::after { content:"▾"; float:right; transition: transform .3s; }
.dropdown.open > a::after { transform: rotate(-180deg); }
.dropdown ul { display:none; margin:4px 0 4px 10px; padding-left:8px; border-left:2px solid var(--border-color); }
.dropdown.open ul { display:block; }
.dropdown ul a { font-size:.92em; }

/* ---------- Контейнер ---------- */
.container {
  flex:1; min-width:0; max-width:1100px; margin:0 auto;
  background: var(--bg-container);
  border:1px solid var(--border-color);
  border-radius: 20px;
  box-shadow: var(--shadow);
  overflow:hidden;
}
.header {
  background: var(--header-bg);
  color: var(--text-title);
  padding:32px 24px; text-align:center;
  border-bottom:1px solid var(--border-color);
}
.header { position:relative; }
#splash {
  position:absolute; right:22px; bottom:16px;
  width:calc(var(--w, 80) * var(--px, 3px));
  height:calc(var(--h, 9) * var(--px, 3px));
  image-rendering: pixelated; image-rendering: crisp-edges;
  transform: rotate(-12deg);
  transform-origin: 50% 50%;
  animation: splash-pulse 1s ease-in-out infinite alternate;
  pointer-events:none; user-select:none;
}
@keyframes splash-pulse {
  from { transform: rotate(-12deg) scale(1); }
  to   { transform: rotate(-12deg) scale(1.1); }
}
.header h1 { font-size:2.1em; margin-bottom:8px; letter-spacing:-.01em; }
.header p { opacity:.85; }
.header .hint {
  display:inline-block; margin-top:12px; padding:4px 14px;
  border-radius:999px; font-size:.85em;
  background: rgba(0,0,0,.25); border:1px solid var(--border-color);
}
body.light-theme .header .hint { background: rgba(255,255,255,.5); }

.input-section { padding:28px; background: var(--bg-section); }
.input-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px;
  margin-bottom:24px;
}
.input-group {
  background: var(--bg-card);
  padding:16px 18px; border-radius:14px;
  border:1px solid var(--border-color);
  border-top:3px solid var(--accent);
  transition: transform .2s, box-shadow .2s;
}
.input-group:focus-within { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.input-group label {
  display:block; font-weight:600; margin-bottom:10px;
  color: var(--text-secondary); font-size:.95em;
}
.input-wrap { position:relative; }
.input-wrap input { padding-right:44px; }
.input-wrap span {
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  color: var(--text-secondary); font-size:.85em; pointer-events:none;
}
input[type=number], input[type=text] {
  width:100%; padding:11px 12px;
  border:2px solid var(--border-color);
  border-radius:10px; font-size:16px;
  background: var(--bg-input); color: var(--text-main);
  transition: border-color .2s, box-shadow .2s;
  font-family:inherit;
}
input:focus { outline:none; border-color: var(--accent); box-shadow:0 0 0 3px rgba(127,140,141,.25); }

.actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
button { font-family:inherit; }
.calculate-btn {
  background: var(--btn-bg); color: var(--btn-text);
  border:none; padding:14px 34px; font-size:17px; font-weight:600;
  border-radius:10px; cursor:pointer;
  transition: transform .2s, box-shadow .2s, opacity .2s;
}
.calculate-btn:hover { transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.35); }
.calculate-btn:active { transform:translateY(0); }
.ghost-btn {
  background: transparent; color: var(--text-main);
  border:2px dashed var(--border-color); padding:12px 22px; font-size:16px;
  border-radius:10px; cursor:pointer; transition: border-color .2s, color .2s, transform .2s;
}
.ghost-btn:hover { border-color: var(--accent); color: var(--text-contrast); transform:translateY(-2px); }
.small-btn {
  background: rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.25);
  padding:6px 12px; border-radius:8px; color:inherit; cursor:pointer; font-size:.85em;
  transition: background .2s;
}
.small-btn:hover { background: rgba(0,0,0,.4); }

/* ---------- Форма своего упражнения ---------- */
#custom-exercise-form {
  display:none; margin-bottom:24px; padding:20px;
  background: var(--bg-card); border:1px solid var(--border-color);
  border-radius:14px; box-shadow: var(--shadow);
}
#custom-exercise-form.open { display:block; animation: pop .25s ease; }
#custom-exercise-form h3 { margin-bottom:14px; color: var(--text-title); }
#custom-exercise-form label { display:block; margin:10px 0 6px; font-size:.9em; color: var(--text-secondary); }
.form-row { display:grid; grid-template-columns: 1fr 110px; gap:12px; }
.form-actions { display:flex; gap:10px; margin-top:16px; }

/* ---------- Результаты ---------- */
.results { padding:28px; display:none; }
.results.show { display:block; }
.results-empty { text-align:center; color: var(--text-secondary); padding:10px; }
.exercise-result {
  margin-bottom:22px; background: var(--bg-table);
  border:1px solid var(--border-color); border-radius:14px; overflow:hidden;
  box-shadow: 0 2px 10px rgba(0,0,0,.3);
  animation: pop .3s ease;
}
.exercise-result:last-child { margin-bottom:0; }
.exercise-header {
  padding:14px 20px; font-size:1.05em; font-weight:700; letter-spacing:.02em;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: var(--on-accent, #fff);
}
.header-left { display:flex; align-items:center; gap:10px; min-width:0; }
.header-left .title { overflow:hidden; text-overflow:ellipsis; }
.badge {
  font-size:.75em; padding:2px 9px; border-radius:999px;
  background: rgba(0,0,0,.25); font-weight:600; white-space:nowrap;
}
.weight-tables { padding:18px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.weight-table { background: var(--bg-card); border-radius:10px; padding:14px; }
.weight-table h4 {
  margin-bottom:10px; color: var(--text-secondary); text-align:center;
  font-size:.8em; text-transform:uppercase; letter-spacing:.1em;
}
table { width:100%; border-collapse:collapse; }
th, td { padding:9px 8px; text-align:center; border-bottom:1px solid var(--border-color); }
tr:last-child td { border-bottom:none; }
th { background: var(--bg-table-header); color: var(--text-contrast); font-size:.85em; }
th:first-child { border-radius:8px 0 0 8px; }
th:last-child { border-radius:0 8px 8px 0; }
td:first-child { font-weight:700; color: var(--text-title); font-variant-numeric: tabular-nums; }
.emoji { font-size:1.2em; }

/* ---------- Тост ошибок ---------- */
#error-message {
  position:fixed; top:20px; left:50%; transform:translate(-50%,-30px);
  background: var(--error-bg); color: var(--error-text);
  padding:12px 22px; border-radius:10px; text-align:center;
  max-width:min(90vw,520px); opacity:0; pointer-events:none;
  box-shadow:0 0 20px rgba(180,0,0,.6);
  transition: opacity .3s, transform .3s; z-index:2000;
}
#error-message.show { opacity:1; transform:translate(-50%,0); }

/* ---------- Тема ---------- */
.theme-toggle {
  position:fixed; left:20px; bottom:20px;
  background:#444; color:#fff; border:none; border-radius:50%;
  width:50px; height:50px; cursor:pointer; font-size:1.4em;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 10px rgba(0,0,0,.4);
  transition: background .3s, transform .2s; z-index:1000;
}
body.light-theme .theme-toggle { background:#ddd; color:#222; }
.theme-toggle:hover { transform: translateY(-2px) rotate(15deg); }

@keyframes pop { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

@media (max-width:820px) {
  body { flex-direction:column; padding:12px; gap:14px; }
  .sidebar { width:100%; position:static; }
  .weight-tables { grid-template-columns:1fr; }
  .header h1 { font-size:1.6em; }
  .header { padding-bottom:52px; }
  #splash { --px:2px; right:14px; bottom:12px; }
  .input-section, .results { padding:16px; }
}
</style>
</head>
<body>

<nav class="sidebar">
  <h2>Меню</h2>
  <ul>
    <li><a href="/">🏠 Главная</a></li>
    <li class="dropdown">
      <a href="#">📂 Разделы</a>
      <ul>
        <li><a href="/gum">Моё тело — железо</a></li>
        <li><a href="/osanka">Позвоночник — титан</a></li>
        <li><a href="/motor">Сердце — мотор</a></li>
      </ul>
    </li>
    <li><a href="/about">ℹ️ О проекте</a></li>
  </ul>
</nav>

<main class="container">
  <header class="header">
    <h1>🏋🏻 Калькулятор рабочих весов</h1>
    <p>Введите ваши лучшие результаты (1ПМ)</p>
    <span class="hint">Подсказка: m(Fe) = 20 кг · v.6.0</span>
    <canvas id="splash" role="img" aria-label="ГИМН КАЧКОВ"></canvas>
  </header>

  <section class="input-section">
    <div class="input-grid" id="input-grid"></div>

    <div id="custom-exercise-form">
      <h3>➕ Новое упражнение</h3>
      <label for="custom-name">Название</label>
      <input type="text" id="custom-name" placeholder="Например: Тяга в наклоне" maxlength="40" autocomplete="off">
      <div class="form-row">
        <div>
          <label for="custom-max">1ПМ (кг)</label>
          <input type="number" id="custom-max" placeholder="0" min="0" max="1000" step="0.5" inputmode="decimal">
        </div>
        <div>
          <label for="custom-emoji">Эмодзи</label>
          <input type="text" id="custom-emoji" placeholder="🏹" maxlength="4" autocomplete="off">
        </div>
      </div>
      <div class="form-actions">
        <button class="calculate-btn" id="custom-add" type="button">Добавить</button>
        <button class="ghost-btn" id="custom-cancel" type="button">Отмена</button>
      </div>
    </div>

    <div class="actions">
      <button class="calculate-btn" id="calc-btn" type="button">Рассчитать</button>
      <button class="ghost-btn" id="open-form" type="button">➕ Добавить упражнение</button>
    </div>
  </section>

  <section class="results" id="results"></section>
</main>

<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Сменить тему">🌙</button>

<script>
(function () {
  'use strict';

  /* ===================== Конфигурация ===================== */
  const BAR = 20;      // вес грифа, кг
  const STEP = 2.5;    // шаг округления, кг

  const GENERIC_WARM = [{p:40,r:10},{p:60,r:6},{p:70,r:3}];
  const GENERIC_WORK = [{p:65,l:'65% (10-12 повт.)'},{p:70,l:'70% (8-10 повт.)'},{p:75,l:'75% (6-8 повт.)'}];

  // accent / accent2 — градиент шапки, dark — тёмный текст на светлой шапке
  const EXERCISES = [
    { id:'deadlift', letter:'A', name:'Становая тяга',     emoji:'🥵', max:505, a:'#c0392b', b:'#7f2a20',
      warm:[{p:43,r:8},{p:57,r:5},{p:64,r:3}],
      work:[{p:70,l:'70% (6-10 повт.)'},{p:75,l:'75% (6-8 повт.)'},{p:80,l:'80% (6 повт.)'},{p:82,l:'82% (максимум)'}] },
    { id:'bench',    letter:'B', name:'Жим лёжа',          emoji:'💪', max:335, a:'#2980b9', b:'#1d4f73',
      warm:GENERIC_WARM,
      work:[{p:70,l:'70% (8-12 повт.)'},{p:75,l:'75% (8-10 повт.)'},{p:80,l:'80% (8 повт.)'}] },
    { id:'squat',    letter:'C', name:'Приседания',        emoji:'🦵', max:525, a:'#27ae60', b:'#1a6f3e',
      warm:GENERIC_WARM,
      work:[{p:70,l:'70% (8-12 повт.)'},{p:75,l:'75% (8-10 повт.)'},{p:80,l:'80% (8 повт.)'}] },
    { id:'biceps',   letter:'D', name:'Подъём на бицепс',  emoji:'🦾', max:150, a:'#fbc531', b:'#e1b12c', dark:true,
      warm:GENERIC_WARM, work:GENERIC_WORK },
    { id:'armypress',letter:'E', name:'Армейский жим',     emoji:'🎖️', max:200, a:'#8e44ad', b:'#5e3370',
      warm:[{p:40,r:8},{p:55,r:5},{p:65,r:3}],
      work:[{p:70,l:'70% (8-10 повт.)'},{p:75,l:'75% (6-8 повт.)'},{p:80,l:'80% (5-6 повт.)'},{p:85,l:'85% (3-5 повт.)'}] }
  ];

  /* ===================== Утилиты ===================== */
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

  function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  function loadCustom() {
    try {
      const list = JSON.parse(load('customExercises') || '[]');
      return Array.isArray(list) ? list.filter(x => x && x.id && x.name && x.oneRM > 0) : [];
    } catch (e) { return []; }
  }
  function saveCustom(list) { store('customExercises', JSON.stringify(list)); }

  function roundWeight(raw) {
    return Math.max(BAR, Math.round(raw / STEP) * STEP);
  }
  const fmt = (n) => String(n).replace('.', ',');

  /* ===================== Тема ===================== */
  function applyTheme(light) {
    document.body.classList.toggle('light-theme', light);
    $('theme-toggle').textContent = light ? '☀️' : '🌙';
  }
  $('theme-toggle').addEventListener('click', () => {
    const light = !document.body.classList.contains('light-theme');
    applyTheme(light);
    store('theme', light ? 'light' : 'dark');
  });

  /* ===================== Ошибки + звук ===================== */
  let audioCtx = null, errTimer = null;
  function playLaugh() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const ctx = audioCtx, now = ctx.currentTime + 0.01;
    const master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);

    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const noise = ctx.createBufferSource(); noise.buffer = buf;
    const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 1200;
    noise.connect(nf); nf.connect(master); noise.start(now); noise.stop(now + 0.08);

    [{t:0,f:200,d:.16},{t:.17,f:260,d:.13},{t:.33,f:320,d:.11}].forEach(s => {
      const o1 = ctx.createOscillator(); o1.type = 'square';   o1.frequency.setValueAtTime(s.f, now + s.t);
      const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.setValueAtTime(s.f * 1.02, now + s.t);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, now + s.t);
      g.gain.exponentialRampToValueAtTime(0.45, now + s.t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + s.t + s.d);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2200;
      o1.connect(g); o2.connect(g); g.connect(f); f.connect(master);
      [o1, o2].forEach(o => { o.start(now + s.t); o.stop(now + s.t + s.d + 0.02); });
    });

    const bass = ctx.createOscillator(); bass.type = 'sine'; bass.frequency.setValueAtTime(90, now + 0.46);
    const gb = ctx.createGain(); gb.gain.setValueAtTime(0.0001, now + 0.46);
    gb.gain.linearRampToValueAtTime(0.35, now + 0.47);
    gb.gain.exponentialRampToValueAtTime(0.0001, now + 0.72);
    bass.connect(gb); gb.connect(master); bass.start(now + 0.46); bass.stop(now + 0.74);
  }
  function showError(msg) {
    const el = $('error-message');
    el.textContent = msg;
    el.classList.add('show');
    try { playLaugh(); } catch (e) {}
    clearTimeout(errTimer);
    errTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ===================== Построение интерфейса ===================== */
  function buildInputs() {
    $('input-grid').innerHTML = EXERCISES.map(ex => `
      <div class="input-group" style="--accent:${ex.a}">
        <label for="${ex.id}">${ex.emoji} ${ex.name}</label>
        <div class="input-wrap">
          <input type="number" id="${ex.id}" placeholder="0" min="0" max="${ex.max}" step="0.5" inputmode="decimal">
          <span>кг</span>
        </div>
      </div>`).join('');
  }

  function tableRows(oneRM, data, isWarm) {
    return data.map(x => {
      const w = roundWeight(oneRM * x.p / 100);
      return `<tr><td>${fmt(w)} кг</td><td>${isWarm ? x.r : esc(x.l)}</td></tr>`;
    }).join('');
  }

  function blockHtml(ex, oneRM, removable) {
    const style = `--accent:${ex.a};--accent2:${ex.b};` + (ex.dark ? '--on-accent:#333;' : '');
    const title = ex.letter ? `ТРЕНИРОВКА ${ex.letter} — ${ex.name.toUpperCase()}` : ex.name.toUpperCase();
    return `
    <article class="exercise-result" id="${ex.id}-result" style="${style}">
      <div class="exercise-header">
        <div class="header-left"><span class="emoji">${esc(ex.emoji)}</span><span class="title">${esc(title)}</span></div>
        <div class="header-actions">
          <span class="badge">1ПМ ${fmt(oneRM)} кг</span>
          ${removable ? `<button class="small-btn" type="button" data-remove="${esc(ex.id)}">Удалить</button>` : ''}
        </div>
      </div>
      <div class="weight-tables">
        <div class="weight-table">
          <h4>Разминочные веса</h4>
          <table><thead><tr><th>Вес</th><th>Повторения</th></tr></thead><tbody>${tableRows(oneRM, ex.warm, true)}</tbody></table>
        </div>
        <div class="weight-table">
          <h4>Рабочие веса</h4>
          <table><thead><tr><th>Вес</th><th>% от 1ПМ</th></tr></thead><tbody>${tableRows(oneRM, ex.work, false)}</tbody></table>
        </div>
      </div>
    </article>`;
  }

  /* ===================== Чтение и валидация ввода ===================== */
  // возвращает {values, error}
  function readInputs() {
    const values = {};
    for (const ex of EXERCISES) {
      const raw = $(ex.id).value.trim();
      if (raw === '') continue;
      const v = parseFloat(raw.replace(',', '.'));
      if (isNaN(v)) return { error: 'Это не число, дружище.' };
      if (v === 0) return { error: 'Ноль — это не вес, ага?' };
      if (v < 0) return { error: 'Отрицательный вес? Это уже антигравитация.' };
      if (v > ex.max) return { error: `«${ex.name}»: рекорд мира ${ex.max} кг. Ты точно не ошибся?` };
      values[ex.id] = v;
    }
    return { values };
  }

  function saveInputs() {
    EXERCISES.forEach(ex => store(ex.id, $(ex.id).value));
  }

  /* ===================== Рендер результатов ===================== */
  function render(values) {
    const custom = loadCustom();
    let html = '';
    EXERCISES.forEach(ex => { if (values[ex.id]) html += blockHtml(ex, values[ex.id], false); });
    custom.forEach(c => {
      html += blockHtml({ id:c.id, name:c.name, emoji:c.emoji || '🏋️', a:'#2980b9', b:'#2c3e50', warm:GENERIC_WARM, work:GENERIC_WORK }, c.oneRM, true);
    });
    const res = $('results');
    res.innerHTML = html || '<p class="results-empty">Пока пусто — введите результаты и нажмите «Рассчитать».</p>';
    res.classList.toggle('show', !!html);
    return !!html;
  }

  function calculate(scroll) {
    const { values, error } = readInputs();
    if (error) { showError(error); return; }
    const hasCustom = loadCustom().length > 0;
    if (!Object.keys(values).length && !hasCustom) {
      showError('Дорогой, нехой пустоту тягать!');
      return;
    }
    saveInputs();
    render(values);
    if (scroll) $('results').scrollIntoView({ behavior:'smooth', block:'start' });
  }

  /* ===================== Свои упражнения ===================== */
  function openForm() {
    $('custom-exercise-form').classList.add('open');
    $('custom-name').focus();
  }
  function closeForm() {
    $('custom-exercise-form').classList.remove('open');
    ['custom-name','custom-emoji','custom-max'].forEach(id => $(id).value = '');
  }
  function uniqueId(name) {
    const taken = new Set([...EXERCISES.map(e => e.id), ...loadCustom().map(c => c.id)]);
    let base = 'c_' + (name.toLowerCase().replace(/[^a-z0-9а-яё]+/gi, '_').replace(/^_+|_+$/g, '') || 'exercise');
    let id = base, i = 1;
    while (taken.has(id)) id = base + '_' + (i++);
    return id;
  }
  function addCustom() {
    const name = $('custom-name').value.trim();
    const emoji = $('custom-emoji').value.trim() || '🏋️';
    const oneRM = parseFloat($('custom-max').value.replace(',', '.'));
    if (!name || isNaN(oneRM) || oneRM <= 0) {
      showError('Называй как хочешь, а поднять что-то обязан!');
      return;
    }
    if (oneRM > 1000) { showError('Больше тонны? Серьёзно?'); return; }
    const list = loadCustom();
    list.push({ id: uniqueId(name), name, emoji, oneRM });
    saveCustom(list);
    closeForm();
    calculateKeepInputs();
    const last = $('results').lastElementChild;
    if (last) last.scrollIntoView({ behavior:'smooth', block:'center' });
  }
  // перерисовать, не ругаясь на пустые стандартные поля
  function calculateKeepInputs() {
    const { values, error } = readInputs();
    render(error ? {} : values);
  }
  function removeCustom(id) {
    if (!confirm('Удалить упражнение?')) return;
    saveCustom(loadCustom().filter(x => x.id !== id));
    calculateKeepInputs();
  }

  /* ===================== Инициализация ===================== */
  document.addEventListener('DOMContentLoaded', () => {
    buildInputs();
    applyTheme(load('theme') === 'light');

    // восстановление значений
    EXERCISES.forEach(ex => {
      const v = load(ex.id);
      if (v !== null) $(ex.id).value = v;
    });
    calculateKeepInputs();

    // события
    $('calc-btn').addEventListener('click', () => calculate(true));
    $('open-form').addEventListener('click', openForm);
    $('custom-cancel').addEventListener('click', closeForm);
    $('custom-add').addEventListener('click', addCustom);

    $('input-grid').addEventListener('keydown', e => { if (e.key === 'Enter') calculate(true); });
    $('custom-exercise-form').addEventListener('keydown', e => {
      if (e.key === 'Enter') addCustom();
      if (e.key === 'Escape') closeForm();
    });
    $('results').addEventListener('click', e => {
      const btn = e.target.closest('[data-remove]');
      if (btn) removeCustom(btn.dataset.remove);
    });

    // меню
    document.querySelectorAll('.dropdown > a').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); a.parentElement.classList.toggle('open'); });
    });
  });
})();
</script>
