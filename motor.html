<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Калькулятор здоровья</title>
<style>
:root {
  --bg-main: linear-gradient(135deg,#333 0%,#1c1c1c 100%);
  --bg-sidebar: #1b1b1b;
  --bg-container: #212121;
  --bg-section: #282828;
  --bg-card: #333;
  --bg-input: #2a2a2a;
  --bg-table: #3a3a3a;
  --bg-table-header: #555;

  --text-main: #ddd;
  --text-secondary: #aaa;
  --text-title: #f0f0f0;
  --text-contrast: #fff;

  --border-color: #4a4a4a;
  --header-bg: linear-gradient(135deg,#444 0%,#333 100%);
  --accent: #4caf50;
  --btn-bg: linear-gradient(135deg,#a60000,#6b0000);
  --btn-text: #fff;
  --error-bg: #a60000;
  --error-text: #fff;
  --shadow: 0 8px 24px rgba(0,0,0,.45);
  --radius: 16px;
}
body.light-theme {
  --bg-main: linear-gradient(135deg,#f2f2f2 0%,#e8e8e8 100%);
  --bg-sidebar: #eaeaea;
  --bg-container: #fff;
  --bg-section: #f9f9f9;
  --bg-card: #f1f1f1;
  --bg-input: #fff;
  --bg-table: #f5f5f5;
  --bg-table-header: #ddd;
  --text-main: #222;
  --text-secondary: #555;
  --text-title: #111;
  --text-contrast: #000;
  --border-color: #ccc;
  --header-bg: linear-gradient(135deg,#ddd 0%,#bbb 100%);
  --accent: #27ae60;
  --shadow: 0 8px 24px rgba(0,0,0,.12);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  background: var(--bg-main); background-attachment: fixed;
  min-height:100vh; padding:20px;
  display:flex; gap:20px; align-items:flex-start;
  color: var(--text-main);
}

/* ---------- Меню ---------- */
.sidebar {
  width:230px; flex-shrink:0;
  background: var(--bg-sidebar);
  border:1px solid var(--border-color);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding:16px; position:sticky; top:20px;
}
.sidebar h2 {
  font-size:.85em; letter-spacing:.14em; text-transform:uppercase;
  margin-bottom:12px; color: var(--text-secondary); text-align:center;
}
.sidebar ul { list-style:none; }
.sidebar li { margin:4px 0; }
.sidebar a {
  display:block; padding:10px 12px; text-decoration:none;
  color: var(--text-main); border-radius:10px;
  transition: background .2s, color .2s, transform .2s;
}
.sidebar a:hover { background: var(--bg-card); color: var(--text-contrast); transform: translateX(2px); }
.dropdown > a::after { content:"▾"; float:right; transition: transform .3s; }
.dropdown.open > a::after { transform: rotate(-180deg); }
.dropdown ul { display:none; margin:4px 0 4px 10px; padding-left:8px; border-left:2px solid var(--border-color); }
.dropdown.open ul { display:block; }
.dropdown ul a { font-size:.92em; }

/* ---------- Контейнер ---------- */
.container {
  flex:1; min-width:0; max-width:1100px; margin:0 auto;
  background: var(--bg-container);
  border:1px solid var(--border-color);
  border-radius:20px; box-shadow: var(--shadow); overflow:hidden;
}
.header {
  position:relative;
  background: var(--header-bg); color: var(--text-title);
  padding:32px 24px; text-align:center;
  border-bottom:1px solid var(--border-color);
}
.header h1 { font-size:2.1em; margin-bottom:8px; letter-spacing:-.01em; }
.header p { opacity:.85; }

/* пиксельная надпись */
#splash {
  position:absolute; right:22px; bottom:16px;
  width:calc(var(--w, 80) * var(--px, 3px));
  height:calc(var(--h, 9) * var(--px, 3px));
  image-rendering: pixelated; image-rendering: crisp-edges;
  transform: rotate(-12deg);
  animation: splash-pulse 1s ease-in-out infinite alternate;
  pointer-events:none; user-select:none;
}
@keyframes splash-pulse {
  from { transform: rotate(-12deg) scale(1); }
  to   { transform: rotate(-12deg) scale(1.1); }
}

/* ---------- Ввод ---------- */
.input-section { padding:28px; background: var(--bg-section); }
.input-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px;
  margin-bottom:24px;
}
.input-group {
  background: var(--bg-card); padding:16px 18px; border-radius:14px;
  border:1px solid var(--border-color); border-top:3px solid var(--accent);
  transition: transform .2s, box-shadow .2s;
}
.input-group:focus-within { transform: translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.35); }
.input-group label { display:block; font-weight:600; margin-bottom:10px; color: var(--text-secondary); font-size:.95em; }
.input-group .opt { font-weight:400; opacity:.7; font-size:.85em; }
.input-wrap { position:relative; }
.input-wrap input { padding-right:62px; }
.input-wrap span {
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  color: var(--text-secondary); font-size:.82em; pointer-events:none;
}
input[type=number], select {
  width:100%; padding:11px 12px;
  border:2px solid var(--border-color); border-radius:10px; font-size:16px;
  background: var(--bg-input); color: var(--text-main);
  transition: border-color .2s, box-shadow .2s; font-family:inherit;
}
input:focus, select:focus { outline:none; border-color: var(--accent); box-shadow:0 0 0 3px rgba(76,175,80,.25); }

.actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
button { font-family:inherit; }
.calculate-btn {
  background: var(--btn-bg); color: var(--btn-text);
  border:none; padding:14px 34px; font-size:17px; font-weight:600;
  border-radius:10px; cursor:pointer; transition: transform .2s, box-shadow .2s;
}
.calculate-btn:hover { transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.35); }
.ghost-btn {
  background: transparent; color: var(--text-main);
  border:2px dashed var(--border-color); padding:12px 22px; font-size:16px;
  border-radius:10px; cursor:pointer; transition: border-color .2s, color .2s, transform .2s;
}
.ghost-btn:hover { border-color: var(--accent); color: var(--text-contrast); transform:translateY(-2px); }

/* ---------- Результаты ---------- */
.results { display:none; padding:28px; }
.results.show { display:block; animation: pop .3s ease; }
.results h2 { font-size:1.2em; margin-bottom:14px; color: var(--text-title); }
.results h3 { font-size:1.05em; margin:26px 0 6px; color: var(--text-title); }
.sub { color: var(--text-secondary); font-size:.88em; margin-bottom:10px; }

.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
.stat {
  background: var(--bg-table); border:1px solid var(--border-color);
  border-radius:14px; padding:16px 18px; border-left:4px solid var(--c, var(--accent));
}
.stat .lbl { font-size:.78em; text-transform:uppercase; letter-spacing:.08em; color: var(--text-secondary); }
.stat .val { font-size:1.7em; font-weight:700; color: var(--text-title); margin:4px 0 2px; font-variant-numeric: tabular-nums; }
.stat .note { font-size:.85em; color: var(--text-secondary); }

.bmi-scale { margin:18px 0 4px; }
.bmi-bar {
  position:relative; height:12px; border-radius:999px;
  background: linear-gradient(90deg,#3498db 0%,#3498db 14%,#27ae60 14%,#27ae60 40%,#f1c40f 40%,#f1c40f 60%,#e67e22 60%,#e67e22 80%,#c0392b 80%);
}
.bmi-marker {
  position:absolute; top:-5px; width:6px; height:22px; border-radius:3px;
  background: var(--text-contrast); border:2px solid var(--bg-container);
  transform:translateX(-50%); box-shadow:0 0 6px rgba(0,0,0,.5);
}
.bmi-labels { display:flex; justify-content:space-between; font-size:.75em; color: var(--text-secondary); margin-top:6px; }

.zones { width:100%; border-collapse:separate; border-spacing:0 8px; }
.zones th {
  background: var(--bg-table-header); color: var(--text-contrast);
  padding:10px 12px; font-size:.85em; text-align:left;
}
.zones th:first-child { border-radius:10px 0 0 10px; }
.zones th:last-child { border-radius:0 10px 10px 0; text-align:center; }
.zones td { background: var(--bg-table); padding:12px; transition: background .2s; }
.zones td:first-child { border-radius:10px 0 0 10px; border-left:5px solid var(--c); }
.zones td:last-child { border-radius:0 10px 10px 0; text-align:center; font-weight:700; color: var(--text-title); font-variant-numeric: tabular-nums; white-space:nowrap; }
.zones tr:hover td { background: rgba(76,175,80,.15); }
.zones .zname { font-weight:600; color: var(--text-title); }
.zones .zdesc { font-size:.82em; color: var(--text-secondary); }

.disclaimer { margin-top:22px; font-size:.82em; color: var(--text-secondary); line-height:1.5; padding-top:14px; border-top:1px solid var(--border-color); }

/* ---------- Тост ---------- */
#error-message {
  position:fixed; top:20px; left:50%; transform:translate(-50%,-30px);
  background: var(--error-bg); color: var(--error-text);
  padding:12px 22px; border-radius:10px; text-align:center;
  max-width:min(90vw,520px); opacity:0; pointer-events:none;
  box-shadow:0 0 20px rgba(180,0,0,.6);
  transition: opacity .3s, transform .3s; z-index:2000;
}
#error-message.show { opacity:1; transform:translate(-50%,0); }

/* ---------- Тема ---------- */
.theme-toggle {
  position:fixed; left:20px; bottom:20px;
  background:#444; color:#fff; border:none; border-radius:50%;
  width:50px; height:50px; cursor:pointer; font-size:1.4em;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 10px rgba(0,0,0,.4); transition: background .3s, transform .2s; z-index:1000;
}
body.light-theme .theme-toggle { background:#ddd; color:#222; }
.theme-toggle:hover { transform: translateY(-2px) rotate(15deg); }

@keyframes pop { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

@media (max-width:820px) {
  body { flex-direction:column; padding:12px; gap:14px; }
  .sidebar { width:100%; position:static; }
  .header h1 { font-size:1.6em; }
  .header { padding-bottom:52px; }
  #splash { --px:2px; right:14px; bottom:12px; }
  .input-section, .results { padding:16px; }
  .zones .zdesc { display:none; }
}
</style>
</head>
<body>

<nav class="sidebar">
  <h2>Меню</h2>
  <ul>
    <li><a href="/">🏠 Главная</a></li>
    <li class="dropdown">
      <a href="#">📂 Разделы</a>
      <ul>
        <li><a href="/gum">Моё тело — железо</a></li>
        <li><a href="/osanka">Позвоночник — титан</a></li>
        <li><a href="/motor">Сердце — мотор</a></li>
      </ul>
    </li>
    <li><a href="/about">ℹ️ О проекте</a></li>
  </ul>
</nav>

<main class="container">
  <header class="header">
    <h1>❤️ Калькулятор здоровья</h1>
    <p>Пульсовые зоны, максимальный пульс и индекс массы тела</p>
    <canvas id="splash" role="img" aria-label="Сделано с любовью"></canvas>
  </header>

  <section class="input-section">
    <div class="input-grid">
      <div class="input-group">
        <label for="age">Возраст</label>
        <div class="input-wrap"><input type="number" id="age" placeholder="Например: 30" min="5" max="120" step="1" inputmode="numeric"><span>лет</span></div>
      </div>
      <div class="input-group">
        <label for="sex">Пол</label>
        <select id="sex">
          <option value="m">Мужской</option>
          <option value="f">Женский</option>
        </select>
      </div>
      <div class="input-group">
        <label for="weight">Вес</label>
        <div class="input-wrap"><input type="number" id="weight" placeholder="Например: 80" min="20" max="250" step="0.1" inputmode="decimal"><span>кг</span></div>
      </div>
      <div class="input-group">
        <label for="height">Рост</label>
        <div class="input-wrap"><input type="number" id="height" placeholder="Например: 178" min="70" max="250" step="1" inputmode="decimal"><span>см</span></div>
      </div>
      <div class="input-group">
        <label for="hrrest">Пульс покоя <span class="opt">(необязательно)</span></label>
        <div class="input-wrap"><input type="number" id="hrrest" placeholder="Например: 70" min="30" max="120" step="1" inputmode="numeric"><span>уд/мин</span></div>
      </div>
    </div>

    <div class="actions">
      <button class="calculate-btn" id="calc-btn" type="button">Рассчитать</button>
      <button class="ghost-btn" id="clear-btn" type="button">Очистить данные</button>
    </div>
  </section>

  <section class="results" id="result"></section>
</main>

<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Сменить тему">🌙</button>
<div id="error-message" role="alert"></div>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const FIELDS = ['age','sex','weight','height','hrrest'];
  const DEFAULT_REST = 70;

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function drop(k) { try { localStorage.removeItem(k); } catch (e) {} }

  /* ===================== Тема ===================== */
  function applyTheme(light) {
    document.body.classList.toggle('light-theme', light);
    $('theme-toggle').textContent = light ? '☀️' : '🌙';
  }
  $('theme-toggle').addEventListener('click', () => {
    const light = !document.body.classList.contains('light-theme');
    applyTheme(light);
    store('theme', light ? 'light' : 'dark');
  });

  /* ===================== Ошибки ===================== */
  let errTimer = null;
  function showError(msg) {
    const el = $('error-message');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(errTimer);
    errTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }

  /* ===================== Чтение и проверка ===================== */
  const num = (id) => {
    const s = $(id).value.trim().replace(',', '.');
    return s === '' ? NaN : parseFloat(s);
  };

  function read() {
    const age = num('age'), weight = num('weight'), heightCm = num('height'), rest = num('hrrest');
    const sex = $('sex').value === 'f' ? 'f' : 'm';

    if (isNaN(age) || isNaN(weight) || isNaN(heightCm) || age <= 0 || weight <= 0 || heightCm <= 0)
      return { error: 'Я для тебя шутка?' };
    if (age < 5 || age > 120)          return { error: 'Ну, вот прямо столько тебе лет?' };
    if (weight < 20 || weight > 250)   return { error: 'Что тяжелее, килограмм пуха или...?' };
    if (heightCm < 70 || heightCm > 250) return { error: 'Ага, Гуливер!' };
    if (!isNaN(rest) && (rest < 30 || rest > 120))
      return { error: 'Ну, хотя бы 30–120 ударов!' };

    return {
      age, sex, weight, height: heightCm / 100,
      rest: isNaN(rest) ? DEFAULT_REST : rest,
      restGiven: !isNaN(rest)
    };
  }

  /* ===================== Формулы ===================== */
  // Макс. ЧСС: Tanaka (2001) — 208 − 0.7·возраст (универсальная);
  // Gulati (2010) для женщин — 206 − 0.88·возраст. Формула «220 − возраст» неточна и не используется.
  function hrMax(age, sex) {
    return sex === 'f'
      ? { value: 206 - 0.88 * age, name: 'Gulati: 206 − 0,88 × возраст' }
      : { value: 208 - 0.7 * age,  name: 'Tanaka: 208 − 0,7 × возраст' };
  }

  // ИМТ по классификации ВОЗ
  function bmiInfo(bmi) {
    if (bmi < 16)   return { t: 'Выраженный дефицит массы', c: '#3498db' };
    if (bmi < 17)   return { t: 'Умеренный дефицит массы',  c: '#3498db' };
    if (bmi < 18.5) return { t: 'Недостаточная масса',      c: '#3498db' };
    if (bmi < 25)   return { t: 'Норма ✅',                 c: '#27ae60' };
    if (bmi < 30)   return { t: 'Избыточная масса (предожирение)', c: '#f1c40f' };
    if (bmi < 35)   return { t: 'Ожирение I степени',       c: '#e67e22' };
    if (bmi < 40)   return { t: 'Ожирение II степени',      c: '#c0392b' };
    return               { t: 'Ожирение III степени ⚠️',    c: '#c0392b' };
  }

  // Зоны по Карвонену: ЧСС = ЧССпокоя + %·(ЧССмакс − ЧССпокоя)
  const ZONES = [
    { name:'Зона 1 · Восстановление', pct:[50,60],  c:'#7f8c8d', d:'Лёгкая активность, разминка, заминка' },
    { name:'Зона 2 · Аэробная',       pct:[60,70],  c:'#27ae60', d:'Жиросжигание, базовая выносливость' },
    { name:'Зона 3 · Темповая',       pct:[70,80],  c:'#f1c40f', d:'Развитие аэробной мощности, порог' },
    { name:'Зона 4 · Анаэробная',     pct:[80,90],  c:'#e67e22', d:'Интервалы, повышение МПК (VO₂max)' },
    { name:'Зона 5 · Максимум',       pct:[90,100], c:'#c0392b', d:'Короткие максимальные усилия' }
  ];

  function calculate(data, silent) {
    const max = hrMax(data.age, data.sex);
    const maxR = Math.round(max.value);
    const hrr = max.value - data.rest;
    if (hrr <= 10) {
      if (!silent) showError('Пульс покоя слишком близок к максимальному — проверь данные.');
      return false;
    }

    const bounds = [50,60,70,80,90,100].map(p => Math.round(data.rest + hrr * p / 100));

    const bmi = data.weight / (data.height * data.height);
    const info = bmiInfo(bmi);
    const h2 = data.height * data.height;
    const wMin = (18.5 * h2).toFixed(1).replace('.', ',');
    const wMax = (24.9 * h2).toFixed(1).replace('.', ',');
    const pos = Math.min(100, Math.max(0, (bmi - 15) / (40 - 15) * 100));

    let html = `
      <h2>Результаты</h2>
      <div class="stats">
        <div class="stat" style="--c:#c0392b">
          <div class="lbl">Макс. пульс</div>
          <div class="val">${maxR} <small style="font-size:.5em">уд/мин</small></div>
          <div class="note">${max.name}</div>
        </div>
        <div class="stat" style="--c:#7f8c8d">
          <div class="lbl">Пульс покоя</div>
          <div class="val">${data.rest} <small style="font-size:.5em">уд/мин</small></div>
          <div class="note">${data.restGiven ? 'введён вами' : 'по умолчанию — измерьте утром лёжа'}</div>
        </div>
        <div class="stat" style="--c:${info.c}">
          <div class="lbl">ИМТ</div>
          <div class="val">${bmi.toFixed(1).replace('.', ',')}</div>
          <div class="note">${info.t}</div>
        </div>
        <div class="stat" style="--c:#27ae60">
          <div class="lbl">Вес в норме для вашего роста</div>
          <div class="val" style="font-size:1.35em">${wMin} – ${wMax} кг</div>
          <div class="note">ИМТ 18,5–24,9</div>
        </div>
      </div>

      <div class="bmi-scale">
        <div class="bmi-bar"><div class="bmi-marker" style="left:${pos}%"></div></div>
        <div class="bmi-labels"><span>15</span><span>18,5</span><span>25</span><span>30</span><span>35</span><span>40</span></div>
      </div>

      <h3>Пульсовые зоны (формула Карвонена)</h3>
      <p class="sub">Резерв пульса: ${Math.round(hrr)} уд/мин (макс. − покой)</p>
      <table class="zones">
        <tr><th>Зона</th><th>Пульс, уд/мин</th></tr>`;

    ZONES.forEach((z, i) => {
      const lo = i === 0 ? bounds[0] : bounds[i] + 1;   // зоны не пересекаются
      const hi = bounds[i + 1];
      html += `<tr style="--c:${z.c}">
        <td><div class="zname">${z.name} <span class="zdesc">(${z.pct[0]}–${z.pct[1]}% резерва)</span></div><div class="zdesc">${z.d}</div></td>
        <td>${lo} – ${hi}</td></tr>`;
    });
    html += '</table>';

    const notes = [];
    if (data.age < 18) notes.push('Для возраста до 18 лет ИМТ оценивают по возрастным перцентилям, взрослые границы здесь ориентировочные.');
    notes.push('ИМТ не учитывает мышечную массу и распределение жира: у тренированных людей он может завышаться.');
    notes.push('Формулы максимального пульса дают среднюю оценку с разбросом около ±10 уд/мин. Для точных значений нужен нагрузочный тест.');
    notes.push('Расчёт носит справочный характер и не заменяет консультацию врача.');
    html += `<p class="disclaimer">${notes.join('<br>')}</p>`;

    const res = $('result');
    res.innerHTML = html;
    res.classList.add('show');
    return true;
  }

  function hideResults() {
    const res = $('result');
    res.classList.remove('show');
    res.innerHTML = '';
  }

  /* ===================== Хранилище ===================== */
  function saveAll() { FIELDS.forEach(id => store('input_' + id, $(id).value)); }

  function restoreAll() {
    FIELDS.forEach(id => {
      const v = load('input_' + id);
      if (v !== null && v !== '') $(id).value = v;
    });
    drop('calc_result');     // старый формат: сохранённый HTML больше не используем
  }

  /* ===================== Действия ===================== */
  function onCalc() {
    const data = read();
    if (data.error) { showError(data.error); return; }
    saveAll();
    if (calculate(data, false)) $('result').scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function onClear() {
    FIELDS.forEach(id => {
      drop('input_' + id);
      if (id === 'sex') $(id).value = 'm'; else $(id).value = '';
    });
    hideResults();
  }

  document.addEventListener('DOMContentLoaded', () => {
    applyTheme(load('theme') === 'light');
    restoreAll();

    // тихий пересчёт, если сохранённые данные валидны
    const data = read();
    if (!data.error) calculate(data, true);

    FIELDS.forEach(id => {
      $(id).addEventListener('input', () => store('input_' + id, $(id).value));
      $(id).addEventListener('change', () => store('input_' + id, $(id).value));
      $(id).addEventListener('keydown', e => { if (e.key === 'Enter') onCalc(); });
    });
    $('calc-btn').addEventListener('click', onCalc);
    $('clear-btn').addEventListener('click', onClear);

    document.querySelectorAll('.dropdown > a').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); a.parentElement.classList.toggle('open'); });
    });
  });
})();
</script>

<script>
/* Пиксельная надпись в стиле сплэшей Minecraft (шрифт 5x8, офлайн) */
(function () {
  'use strict';
  const G = {
    'С': ['.XXX.','X...X','X....','X....','X....','X...X','.XXX.'],
    'д': [null,null,'..XXX','..X.X','.X..X','.X..X','XXXXX','X...X'],
    'е': [null,null,'.XXX.','X...X','XXXXX','X....','.XXX.'],
    'л': [null,null,'..XXX','.X..X','.X..X','X...X','X...X'],
    'а': [null,null,'.XXX.','....X','.XXXX','X...X','.XXXX'],
    'н': [null,null,'X...X','X...X','XXXXX','X...X','X...X'],
    'о': [null,null,'.XXX.','X...X','X...X','X...X','.XXX.'],
    'с': [null,null,'.XXXX','X....','X....','X....','.XXXX'],
    'ю': [null,null,'X..XX.','X.X..X','XXX..X','X.X..X','X..XX.'],
    'б': ['..XXX','.X...','XXXX.','X...X','X...X','X...X','.XXX.'],
    'в': [null,null,'XXXX.','X...X','XXXX.','X...X','XXXX.'],
    'ь': [null,null,'X....','X....','XXXX.','X...X','XXXX.'],
    '♥': [null,'.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...']
  };
  const TEXT = 'Сделано с любовью ♥';
  const ROWS = 8;

  function build() {
    const cells = []; let x = 1;
    for (const ch of TEXT) {
      if (ch === ' ') { x += 3; continue; }
      const g = G[ch]; if (!g) continue;
      const w = Math.max(...g.map(r => r ? r.length : 0));
      g.forEach((row, y) => {
        if (!row) return;
        for (let i = 0; i < row.length; i++) if (row[i] === 'X') cells.push({ x: x + i, y, heart: ch === '♥' });
      });
      x += w + 1;
    }
    return { cells, width: x };
  }

  function draw() {
    const c = document.getElementById('splash'); if (!c) return;
    const light = document.body.classList.contains('light-theme');
    const main = light ? '#f0b400' : '#ffff55';
    const shadow = light ? '#4a3800' : '#3f3f15';
    const { cells, width } = build();
    const W = width + 1, H = ROWS + 1;
    c.width = W; c.height = H;
    c.style.setProperty('--w', W); c.style.setProperty('--h', H);
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = shadow;
    cells.forEach(p => ctx.fillRect(p.x + 1, p.y + 1, 1, 1));
    cells.forEach(p => { ctx.fillStyle = p.heart ? '#ff3b3b' : main; ctx.fillRect(p.x, p.y, 1, 1); });
  }

  document.addEventListener('DOMContentLoaded', () => {
    draw();
    new MutationObserver(draw).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  });
})();
</script>
